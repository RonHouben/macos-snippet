name: snippingToolHost
options:
  createIntermediateGroups: true
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: '26.0'
    SWIFT_VERSION: '6.0'
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
packages:
  snippingToolPackage:
    path: .
targets:
  snippingToolHost:
    type: application
    platform: macOS
    deploymentTarget: '26.0'
    sources:
      - path: Sources/snippingTool
    dependencies:
      - package: snippingToolPackage
        product: snippingToolCore
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.ronhouben.snippingtool.host
        PRODUCT_NAME: snippingTool
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: U9TUQFBL8D
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: snippingTool
        INFOPLIST_KEY_CFBundleName: snippingTool
        INFOPLIST_KEY_CFBundleShortVersionString: $(MARKETING_VERSION)
        INFOPLIST_KEY_CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        INFOPLIST_KEY_LSUIElement: YES
        SWIFT_EMIT_LOC_STRINGS: NO
      configs:
        Debug:
          ENABLE_HARDENED_RUNTIME: NO
        Release:
          ENABLE_HARDENED_RUNTIME: YES

  snippingToolHostUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: '26.0'
    sources:
      - path: UITests
      - path: Sources/snippingTool/App/AutomationSupport.swift
    dependencies:
      - target: snippingToolHost
      - package: snippingToolPackage
        product: snippingToolCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ronhouben.snippingtool.host-uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: minimal

  snippingToolHostTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: '26.0'
    sources:
      - path: Tests/snippingToolTests
    dependencies:
      - target: snippingToolHost
      - package: snippingToolPackage
        product: snippingToolCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ronhouben.snippingtool.host-tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: '$(BUILT_PRODUCTS_DIR)/snippingTool.app/Contents/MacOS/snippingTool'
        BUNDLE_LOADER: '$(TEST_HOST)'
        SWIFT_STRICT_CONCURRENCY: minimal

schemes:
  snippingToolHost:
    build:
      targets:
        snippingToolHost: all
        snippingToolHostTests:
          - test
        snippingToolHostUITests:
          - test
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: snippingToolHostTests
        - name: snippingToolHostUITests
